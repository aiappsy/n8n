services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_NON_ROOT_USER: ${POSTGRES_NON_ROOT_USER:-n8n}
      POSTGRES_NON_ROOT_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD:-${POSTGRES_PASSWORD:?Database password required}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - n8n-network

  # n8n Application
  n8n:
    # Option 1: Use pre-built official image (recommended for Coolify)
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    
    # Option 2: Build from Dockerfile (uncomment to build instead)
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     N8N_VERSION: ${N8N_VERSION:-latest}
    
    # Option 3: Build from source (uncomment to build from source)
    # build:
    #   context: .
    #   dockerfile: Dockerfile.build
    #   args:
    #     NODE_VERSION: ${NODE_VERSION:-22.21.0}
    #     N8N_VERSION: ${N8N_VERSION:-latest}
    #     N8N_RELEASE_TYPE: ${N8N_RELEASE_TYPE:-stable}
    
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Database Configuration
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?Database password required}
      
      # n8n Configuration
      - N8N_HOST=${N8N_HOST:-0.0.0.0}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-}
      
      # Security
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-}
      
      # Encryption
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Encryption key required}
      
      # Timezone
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${TZ:-UTC}
      
      # Execution
      - EXECUTIONS_PROCESS=main
      - EXECUTIONS_MODE=${EXECUTIONS_MODE:-regular}
      
      # Data Folder
      - N8N_USER_FOLDER=/home/node/.n8n
      
      # Diagnostics
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED:-true}
      - N8N_PERSONALIZATION_ENABLED=${N8N_PERSONALIZATION_ENABLED:-true}
      
      # External Secrets (optional)
      - N8N_EXTERNAL_SECRETS_UPDATE_INTERVAL=${N8N_EXTERNAL_SECRETS_UPDATE_INTERVAL:-300}
      
      # Node Environment
      - NODE_ENV=production
      - NODE_FUNCTION_ALLOW_BUILTIN=${NODE_FUNCTION_ALLOW_BUILTIN:-}
      - NODE_FUNCTION_ALLOW_EXTERNAL=${NODE_FUNCTION_ALLOW_EXTERNAL:-}
      
      # Optional: Queue Mode (for scaling)
      - QUEUE_BULL_REDIS_HOST=${QUEUE_BULL_REDIS_HOST:-}
      - QUEUE_BULL_REDIS_PORT=${QUEUE_BULL_REDIS_PORT:-}
      - QUEUE_BULL_REDIS_DB=${QUEUE_BULL_REDIS_DB:-}
      - QUEUE_BULL_REDIS_PASSWORD=${QUEUE_BULL_REDIS_PASSWORD:-}
      
      # Optional: Email Configuration
      - N8N_EMAIL_MODE=${N8N_EMAIL_MODE:-}
      - N8N_SMTP_HOST=${N8N_SMTP_HOST:-}
      - N8N_SMTP_PORT=${N8N_SMTP_PORT:-}
      - N8N_SMTP_USER=${N8N_SMTP_USER:-}
      - N8N_SMTP_PASS=${N8N_SMTP_PASS:-}
      - N8N_SMTP_SENDER=${N8N_SMTP_SENDER:-}
      
      # Optional: Log Level
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_LOG_OUTPUT=${N8N_LOG_OUTPUT:-console}
      
      # Optional: Metrics
      - N8N_METRICS=${N8N_METRICS:-false}
      - N8N_METRICS_PREFIX=${N8N_METRICS_PREFIX:-n8n_}
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/home/node/app/packages/cli/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:5678/healthz || curl -f http://localhost:5678/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - n8n-network
    labels:
      # Coolify labels for automatic proxy configuration
      - "coolify.managed=true"
      - "coolify.name=n8n"
      - "coolify.service=n8n"

# Optional: Redis for Queue Mode (uncomment if needed for scaling)
#  redis:
#    image: redis:7-alpine
#    restart: unless-stopped
#    volumes:
#      - redis_data:/data
#    healthcheck:
#      test: ['CMD', 'redis-cli', 'ping']
#      interval: 10s
